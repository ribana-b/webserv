server {
    listen 8082;
    root ./html;
    index index.html;

    # / must answer to GET request ONLY
    location / {
        root ./html;
        allow_methods GET;
        autoindex on;
    }

    # /put_test/* must answer to PUT request and save files
    location /put_test {
        root ./put_test;
        allow_methods PUT;
        client_max_body_size 10M;
    }

    # /post_body must answer to POST request with maxBody of 100
    location /post_body {
        root ./html;
        allow_methods POST;
        client_max_body_size 100;
    }

    # /directory/ must answer to GET and root is YoupiBanane
    # if no file requested, search for youpi.bad_extension
    location /directory {
        root ./YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex on;
    }
}
